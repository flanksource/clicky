name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in dry-run mode (no actual release)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

env:
  GO_VERSION: "1.26"

jobs:
  semantic-release:
    name: Semantic Release
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_major_version: ${{ steps.semantic.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.semantic.outputs.new_release_minor_version }}
      new_release_patch_version: ${{ steps.semantic.outputs.new_release_patch_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build and commit the embedded task-ui bundle (taskui.js) so the release
      # commit/tag carries it. It is gitignored build output, so without this a
      # downstream module fetching clicky by tag/SHA fails task/ui/assets.go's
      # `//go:embed dist/taskui.js` with "no matching files found".
      - name: Build and commit task-ui bundle
        if: github.event.inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ secrets.FLANKBOT }}
        run: |
          make task-ui
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f task/ui/dist/taskui.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(embed): rebuild task-ui bundle [skip ci]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "task-ui bundle unchanged"
          fi

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          dry_run: ${{ github.event.inputs.dry-run == 'true' }}
          extra_plugins: |
            @semantic-release/git@10
            @semantic-release/github@10
            @semantic-release/changelog@6
            @semantic-release/exec@6
            conventional-changelog-conventionalcommits@7
        env:
          GITHUB_TOKEN: ${{ secrets.FLANKBOT }}

      - name: Release Summary
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "=== Release Summary ==="
          echo "New release published: ${{ steps.semantic.outputs.new_release_published }}"
          if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            echo "New version: v${{ steps.semantic.outputs.new_release_version }}"
            echo "Release type: ${{ steps.semantic.outputs.new_release_major_version != '' && 'major' || (steps.semantic.outputs.new_release_minor_version != '' && 'minor' || 'patch') }}"
            echo "GitHub release will be created by GoReleaser"
          else
            echo "No release was created"
            echo "This could indicate:"
            echo "  - No commits since last release"
            echo "  - Only commits that don't trigger releases (like 'docs:', 'ci:', etc.)"
            echo "  - Configuration issue"

            # Show recent commits for debugging
            echo ""
            echo "Recent commits:"
            git log --oneline -5
          fi

  goreleaser:
    name: GoReleaser
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run tests
        run: make test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}

  # Publish the in-repo Go sub-modules (aichat, valkey, …) by pushing
  # path-prefixed tags (`aichat/vX.Y.Z`). A Go module nested in the repo is only
  # `go get`-able once such a tag exists; the root release tag does not cover it.
  # Each sub-module's `replace github.com/flanksource/clicky => ../` is ignored by
  # downstream consumers, so its `require` pin governs — we bump it to the freshly
  # released version (valkey otherwise pins the non-existent clicky v0.0.0 and is
  # uninstallable) and commit that pin before tagging.
  release-submodules:
    name: Release Sub-modules
    needs: [semantic-release, goreleaser]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release commit/tag was pushed by semantic-release after this
          # workflow started, so fetch the live branch tip, not the trigger SHA.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Tag and push sub-modules
        env:
          GH_TOKEN: ${{ secrets.FLANKBOT }}
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tags=()
          # Publishable sub-modules: every nested go.mod that requires the root
          # module, excluding the //go:build ignore example demos. The root
          # go.mod has no slash so `*/go.mod` already skips it.
          for modfile in $(git ls-files '*/go.mod'); do
            dir="${modfile%/go.mod}"
            case "$dir" in examples|examples/*) continue ;; esac
            grep -q 'github.com/flanksource/clicky ' "$modfile" || continue
            (cd "$dir" && go mod edit -require="github.com/flanksource/clicky@v${VERSION}")
            git add "$dir/go.mod"
            tags+=("${dir}/v${VERSION}")
          done

          if [ ${#tags[@]} -eq 0 ]; then
            echo "No publishable sub-modules found"
            exit 0
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): pin sub-modules to v${VERSION} [skip ci]"
          fi

          for tag in "${tags[@]}"; do
            git tag -f "$tag"
          done

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ github.ref_name }}"
          for tag in "${tags[@]}"; do
            echo "Pushing tag $tag"
            git push -f origin "refs/tags/${tag}"
          done

  announce:
    name: Announce Release
    needs: [semantic-release, goreleaser, release-submodules]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release announcement
        env:
          VERSION: v${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          echo "🚀 Clicky $VERSION has been released!" > announcement.txt
          echo "" >> announcement.txt
          echo "## Installation" >> announcement.txt
          echo "" >> announcement.txt
          echo "### Using Go:" >> announcement.txt
          echo "\`\`\`bash" >> announcement.txt
          echo "go install github.com/${{ github.repository }}/cmd/clicky@$VERSION" >> announcement.txt
          echo "\`\`\`" >> announcement.txt
          echo "" >> announcement.txt
          echo "### Using Homebrew (macOS/Linux):" >> announcement.txt
          echo "\`\`\`bash" >> announcement.txt
          echo "brew install ${{ github.repository_owner }}/tap/clicky" >> announcement.txt
          echo "\`\`\`" >> announcement.txt
          echo "" >> announcement.txt
          echo "### Using Docker:" >> announcement.txt
          echo "\`\`\`bash" >> announcement.txt
          echo "docker pull ghcr.io/${{ github.repository }}:$VERSION" >> announcement.txt
          echo "\`\`\`" >> announcement.txt
          echo "" >> announcement.txt
          echo "See the full changelog at: https://github.com/${{ github.repository }}/releases/tag/$VERSION" >> announcement.txt
          cat announcement.txt
