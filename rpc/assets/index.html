<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}} - API Explorer</title>
    <style>
        html,
        body,
        #api-reference {
            height: 100%;
            margin: 0;
        }

        body {
            background: #fff;
        }

        .api-header {
            align-items: center;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 16px;
            justify-content: space-between;
            padding: 12px 20px;
        }

        .api-header h1 {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.2;
            margin: 0;
        }

        .api-header p {
            color: #6b7280;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            margin: 4px 0 0;
        }

        .spec-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .spec-links a {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            color: #111827;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            padding: 6px 10px;
            text-decoration: none;
        }

        .spec-links a:hover {
            background: #f3f4f6;
        }

        #api-reference {
            height: calc(100% - 65px);
        }
    </style>
</head>
<body>
    <header class="api-header">
        <div>
            <h1>{{.Title}}</h1>
            <p>{{.Description}} · Version {{.Version}} · Generated {{.Timestamp}}</p>
        </div>
        <nav class="spec-links" aria-label="Download OpenAPI specification">
            <a href="/api/openapi.json" target="_blank" rel="noreferrer">JSON</a>
            <a href="/api/openapi.yaml" target="_blank" rel="noreferrer">YAML</a>
        </nav>
    </header>

    <div id="api-reference"></div>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
        const createReference = (url) =>
            Scalar.createApiReference("#api-reference", {
                url,
                hideClientButton: false,
                showSidebar: true,
            });

        let reference = createReference("/api/openapi.json");

        {{if .AutoRefresh}}
        setInterval(function() {
            if (reference && typeof reference.destroy === "function") {
                reference.destroy();
            }
            reference = createReference("/api/openapi.json?refresh=" + Date.now());
        }, 5000);
        {{end}}
    </script>
</body>
</html>
