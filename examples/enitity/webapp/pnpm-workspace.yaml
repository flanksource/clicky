# Local catalog so pnpm can resolve the `catalog:` specifiers declared by
# @flanksource/clicky-ui when it is linked via `file:`. The versions below
# mirror clicky-ui's own pnpm-workspace.yaml. Keep them in sync when the
# library dependency versions change.
packages:
  - "."

catalog:
  '@flanksource/clicky-ui': ^0.3.25
  "@iconify/react": ^5.0.2
  "@radix-ui/react-compose-refs": ^1.1.2
  "@radix-ui/react-slot": ^1.1.1
  "@scalar/api-reference-react": ^0.9.31
  "@shikijs/transformers": ^1.24.0
  "@tanstack/react-query": ^5.66.8
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^0.469.0
  marked: ^15.0.0
  oxlint: ^1.60.0
  react-grab: ^0.1.47
  react-router-dom: ^7.18.1
  shiki: ^1.24.0
  tailwind-merge: ^2.6.0
  vite: ^7.3.6

catalogMode: prefer

onlyBuiltDependencies:
  - esbuild
  - vue-demi

overrides:
  "@radix-ui/react-compose-refs": ^1.1.2
  "@radix-ui/react-slot": ^1.1.1
  "@scalar/api-reference-react": ^0.9.31
  "@shikijs/transformers": ^1.24.0
  "@tanstack/react-query": ^5.66.8
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dompurify: ^3.4.11
  lucide-react: ^0.469.0
  marked: ^15.0.0
  shell-quote: ^1.8.4
  shiki: ^1.24.0
  tailwind-merge: ^2.6.0
